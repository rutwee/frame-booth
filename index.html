<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frame App</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&family=Fira+Sans:wght@400;500;700&family=Inter:wght@400;500;700&family=Lora:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Roboto+Slab:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
</head>

<body>

  <header class="top-bar">
    <div class="top-bar-content">
      <div class="top-actions" aria-label="history actions">
        <button id="undoBtn" class="top-icon-btn" title="Undo (Ctrl/Cmd+Z)">
          <img src="icons/undo_icon.svg" alt="Undo">
        </button>
        <button id="redoBtn" class="top-icon-btn" title="Redo (Ctrl/Cmd+Shift+Z)">
          <img src="icons/redo_icon.svg" alt="Redo">
        </button>
        <button id="resetBtn" class="top-icon-btn" title="Reset scene">
          <img src="icons/refresh_icon.svg" alt="Reset">
        </button>
        <button id="toolbarToggleBtn" class="top-icon-btn toolbar-toggle-btn" title="Toggle controls" aria-controls="toolbarPanel" aria-expanded="false">
          <img src="icons/menu_icon.svg" alt="Toggle Controls">
        </button>
      </div>
      <div class="app-title-wrapper">
      <img src="icons/framebooth_icon.svg" alt="Frame Booth Logo" class="app-logo">
      <h1 class="app-title">Frame Booth</h1>
    </div>
    </div>
  </header>

  <main class="preview-wrap">
    <canvas id="myCanvas"></canvas>
    <div id="mockupArea"></div>
  </main>

  <aside id="toolbarPanel" class="toolbar" role="toolbar" aria-label="controls">

    <div class="toolbar-group">
      <label>Screenshot</label>
      <input type="file" id="fileInput" accept="image/*" hidden>

      <div class="button-row">
        <button id="uploadBtn" class="btn accent-green" title="Upload a screenshot (PNG, JPG) (Max 8MB)">
          <img src="icons/add_screenshot_icon.svg" alt="Add Screenshot">
          <span>Add</span>
        </button>

        <button id="deleteBtn" class="btn accent-red" disabled title="Delete the currently selected screenshot/frame">
          <img src="icons/delete_icon_2.svg" alt="Delete">
          <span>Delete</span>
        </button>
      </div>
    </div>

    <div class="toolbar-group">
      <label for="frameSelect">Device Frame</label>
      <div class="select-wrapper">
        <select id="frameSelect"></select>
      </div>

      <div class="button-row stacked">
        <button id="addFrameBtn" class="btn accent-orange" title="Add the selected device frame to the canvas">
          <img src="icons/add_frame_icon.svg" alt="Add Frame">
          <span>Add Frame</span>
        </button>

        <button id="updateFrameBtn" class="btn accent-orange" disabled title="Replace the selected frame with the one from the dropdown">
          <img src="icons/update_frame_icon.svg" alt="Update Frame">
          <span>Update Frame</span>
        </button>
      </div>
    </div>

    <div class="toolbar-group">
      <label>Canvas Settings</label>
      <div class="canvas-toggle-row">
        <input type="checkbox" id="canvasEnabled">
        <label for="canvasEnabled">Enable Canvas</label>
      </div>
      <div id="canvasSettingsPanel" class="canvas-settings-panel">
        <div class="input-row">
          <div class="input-group small">
            <label for="docWidth">Width</label>
            <input type="number" id="docWidth" min="200" value="900">
          </div>
          <div class="input-group small">
            <label for="docHeight">Height</label>
            <input type="number" id="docHeight" min="400" value="600">
          </div>
        </div>
        <div class="input-group color-group">
          <label for="bgColor">BG Color</label>
          <div class="canvas-color-controls">
            <div class="select-wrapper gradient-select-wrapper">
              <select id="bgGradient" title="Canvas gradient"></select>
            </div>
            <input type="file" id="bgImageInput" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" hidden>
            <div class="color-picker-wrapper">
              <input type="color" id="bgColor" value="#ffffff">
            </div>
          </div>
        </div>
        <div id="gradientCustomPanel" class="gradient-custom-panel is-disabled">
          <div id="gradientEditor" class="gradient-editor" title="Click to add gradient stops">
            <div id="gradientBar" class="gradient-bar"></div>
            <div id="gradientStopsLayer" class="gradient-stops-layer"></div>
          </div>
          <div class="gradient-controls-row">
            <label for="gradientAngle">Angle</label>
            <input type="range" id="gradientAngle" min="0" max="360" value="135" title="Gradient angle">
            <span id="gradientAngleValue" class="gradient-angle-value">135deg</span>
          </div>
          <input type="color" id="gradientStopColor" class="gradient-stop-color-input" value="#8ec5ff">
          <input type="hidden" id="customGradientData" value='{"angle":135,"stops":[{"id":"gs-1","position":0,"color":"#e0f7ff"},{"id":"gs-2","position":1,"color":"#8ec5ff"}]}'>
        </div>
        <div class="button-row stacked">
          <button id="canvasImageBtn" type="button" class="btn accent-purple" title="Add an image on top of the canvas background">
            <img src="icons/add_screenshot_placeholder.svg" alt="Add Image">
            <span>Add Image</span>
          </button>
          <button id="canvasTextBtn" type="button" class="btn accent-purple" title="Add text on top of the canvas background">
            <img src="icons/add_text_icon.svg" alt="Add Text">
            <span>Add Text</span>
          </button>
        </div>
        <div id="canvasTextPanel" class="canvas-text-panel is-disabled">
          <label for="canvasTextInput">Text</label>
          <input id="canvasTextInput" type="text" placeholder="Type text" maxlength="160" autocomplete="off">
          <div class="canvas-text-controls canvas-text-controls-top">
            <div class="select-wrapper">
              <select id="canvasTextFontFamily" title="Font family">
                <option value="Arial" selected>Arial</option>
                <option value="Manrope">Manrope</option>
                <option value="Rethink Sans">Rethink Sans</option>
                <option value="Poppins">Poppins</option>
                <option value="Inter">Inter</option>
                <option value="Montserrat">Montserrat</option>
                <option value="DM Sans">DM Sans</option>
                <option value="Fira Sans">Fira Sans</option>
                <option value="Space Grotesk">Space Grotesk</option>
                <option value="SF Pro Text">SF Pro Text</option>
                <option value="SF Pro Display">SF Pro Display</option>
                <option value="SF UI Text">SF UI Text</option>
                <option value="SF UI Display">SF UI Display</option>
                <option value="New York">New York</option>
                <option value="SF Mono">SF Mono</option>
                <option value="Helvetica Neue">Helvetica Neue</option>
                <option value="Avenir Next">Avenir Next</option>
                <option value="Cormorant Garamond">Cormorant Garamond</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Lora">Lora</option>
                <option value="Roboto Slab">Roboto Slab</option>
                <option value="Bebas Neue">Bebas Neue</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
              </select>
            </div>
            <input id="canvasTextSize" type="number" min="8" max="180" value="36" title="Text size">
            <button id="canvasTextBoldBtn" type="button" class="text-style-btn" title="Bold">B</button>
            <button id="canvasTextItalicBtn" type="button" class="text-style-btn" title="Italic">I</button>
            <button id="canvasTextUnderlineBtn" type="button" class="text-style-btn" title="Underline">U</button>
          </div>
          <div class="canvas-text-controls canvas-text-controls-bottom">
            <div class="select-wrapper text-gradient-select-wrapper">
              <select id="canvasTextColorGradient" title="Text gradient">
                <option value="solid" selected>Solid</option>
              </select>
            </div>
            <input id="canvasTextColor" type="color" value="#2f3a4f" title="Text color">
            <div class="select-wrapper text-gradient-select-wrapper">
              <select id="canvasTextHighlightGradient" title="Highlight gradient">
                <option value="none">None</option>
                <option value="solid" selected>Solid</option>
              </select>
            </div>
            <input id="canvasTextHighlight" type="color" value="#fff0a8" title="Highlight fill color">
            <div class="select-wrapper">
              <select id="canvasTextAlign" title="Text align">
                <option value="left">Left</option>
                <option value="center" selected>Center</option>
                <option value="right">Right</option>
              </select>
            </div>
          </div>
          <div id="textGradientCustomPanel" class="gradient-custom-panel is-disabled">
            <div id="textGradientEditor" class="gradient-editor" title="Click to add gradient stops">
              <div id="textGradientBar" class="gradient-bar"></div>
              <div id="textGradientStopsLayer" class="gradient-stops-layer"></div>
            </div>
            <div class="gradient-controls-row">
              <label for="textGradientAngle">Angle</label>
              <input type="range" id="textGradientAngle" min="0" max="360" value="135" title="Text gradient angle">
              <span id="textGradientAngleValue" class="gradient-angle-value">135deg</span>
            </div>
            <input type="color" id="textGradientStopColor" class="gradient-stop-color-input" value="#8ec5ff">
            <input type="hidden" id="customTextGradientData" value='{"angle":135,"stops":[{"id":"gs-1","position":0,"color":"#e0f7ff"},{"id":"gs-2","position":1,"color":"#8ec5ff"}]}'>
          </div>
          <div id="textHighlightGradientCustomPanel" class="gradient-custom-panel is-disabled">
            <div id="textHighlightGradientEditor" class="gradient-editor" title="Click to add gradient stops">
              <div id="textHighlightGradientBar" class="gradient-bar"></div>
              <div id="textHighlightGradientStopsLayer" class="gradient-stops-layer"></div>
            </div>
            <div class="gradient-controls-row">
              <label for="textHighlightGradientAngle">Angle</label>
              <input type="range" id="textHighlightGradientAngle" min="0" max="360" value="135" title="Highlight gradient angle">
              <span id="textHighlightGradientAngleValue" class="gradient-angle-value">135deg</span>
            </div>
            <input type="color" id="textHighlightGradientStopColor" class="gradient-stop-color-input" value="#8ec5ff">
            <input type="hidden" id="customTextHighlightGradientData" value='{"angle":135,"stops":[{"id":"gs-1","position":0,"color":"#fff8d7"},{"id":"gs-2","position":1,"color":"#ffe6a7"}]}'>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar-group">
      <label>Export</label>

      <button id="downloadFrameBtn" class="btn accent-blue" disabled title="Export only the selected frame as a PNG">
        <img src="icons/download_frame_icon.svg" alt="Download Frame">
        <span>Download Frame</span>
      </button>

      <button id="downloadBtn" class="btn accent-blue" title="Export the entire scene as a high-quality PNG">
        <img src="icons/download_scene_icon.svg" alt="Download Scene">
        <span>Download Scene</span>
      </button>
    </div>

  </aside>
  <div id="toolbarBackdrop" class="toolbar-backdrop" hidden></div>

  <div class="corner-links" aria-label="quick links">
    <a id="contactLink" class="corner-icon-btn" href="mailto:framebooth.ca@gmail.com" title="Contact">
      <img src="icons/email_icon_2.svg" alt="Contact">
    </a>
    <a id="donateLink" class="corner-icon-btn" href="https://buymeacoffee.com/rutwee" target="_blank" rel="noopener noreferrer" title="Buy me a coffee">
      <img src="icons/buymeacoffee_icon.svg" alt="Buy Me a Coffee">
    </a>
  </div>

  <nav class="legal-links" aria-label="legal links">
    <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
    <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms</a>
    <a href="disclaimer.html" target="_blank" rel="noopener noreferrer">Disclaimer</a>
  </nav>

  <script type="module" src="js/main.js"></script>

</body>
</html>
